<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Stealth Mode — Momentum, found and managed</title>
    <meta
      name="description"
      content="An agent that hunts momentum across the market and manages the book you build from it."
    />

    <!--
      Three faces, each with one job. Geist sets the interface. Source Serif
      carries the page titles and the measured figures — a serif is what makes a
      page of numbers read as a statement rather than a dashboard. Geist Mono is
      reserved for identifiers you might read character by character: symbols
      and folios. `globals.css` maps these onto --font-geist-sans and friends.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
    />

    <!--
      Sets data-theme before first paint so a stored choice never flashes the
      system theme on the way in. Inlined here rather than imported because a
      module script would run after the first paint, which is the whole flash.
      Kept in sync by hand with THEME_KEY in src/components/shell/theme-store.ts.
    -->
    <script>
      try {
        var t = localStorage.getItem("stealth:theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
